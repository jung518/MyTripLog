<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyTripLog</title>
    <meta name="description" content="내가 다녀온 여행을 지도에 기록하는 개인 여행 다이어리" />
    <!-- 링크 미리보기 (카카오톡·슬랙·페이스북 등: Open Graph / X: twitter 카드). 이미지는 꼭 https 전체 주소 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MyTripLog" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://mytriplog-nu.vercel.app/" />
    <meta property="og:title" content="MyTripLog · 나의 여행 지도" />
    <meta property="og:description" content="다녀온 나라와 도시, 숙소와 경비를 지도 위에 여권처럼 기록하는 여행 다이어리" />
    <meta property="og:image" content="https://mytriplog-nu.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MyTripLog 로고와 '나의 여행 지도' 문구가 있는 여권 표지" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyTripLog · 나의 여행 지도" />
    <meta name="twitter:description" content="다녀온 나라와 도시, 숙소와 경비를 지도 위에 여권처럼 기록하는 여행 다이어리" />
    <meta name="twitter:image" content="https://mytriplog-nu.vercel.app/og-image.png" />
    <!-- 파비콘: public/favicon.png 원본을 줄인 파일 (탭 64px, 홈 화면 180px) -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- 세계 지도 데이터는 앱 코드가 실행되기 전부터 같이 받기 시작 (지도가 늦게 뜨는 문제) -->
    <link rel="preload" href="/data/countries.json" as="fetch" type="application/json" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Hi+Melody&family=Courier+Prime:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
